{{- /* StatefulSet provisions per-pod PVCs via volumeClaimTemplates, so this
       standalone shared PVC is only for the Deployment workload. */ -}}
{{- if and (eq .Values.controller.kind "Deployment") .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "alertsnitch.fullname" . }}-wal
  labels:
    {{- include "alertsnitch.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
