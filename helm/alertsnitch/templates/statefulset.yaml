{{- if eq .Values.controller.kind "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "alertsnitch.fullname" . }}
  labels:
    {{- include "alertsnitch.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "alertsnitch.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alertsnitch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alertsnitch.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        {{- include "alertsnitch.container" . | nindent 8 }}
      {{- include "alertsnitch.podScheduling" . | nindent 6 }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: wal
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
  {{- end }}
{{- end }}
