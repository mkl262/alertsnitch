version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 5
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - whyNoLint
        - ifElseChain
        - octalLiteral
      enabled-tags:
        - diagnostic
        - performance
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - gocognit
          - goconst
          - gocyclo
          - gosec
          - noctx
        path: _test\.go
      - linters:
          - gosec
        text: G104
      - linters:
          - gosec
        text: G402
      - linters:
          - gocritic
        text: hugeParam
      # Curated Prometheus label-name allow-lists (labels.go, metadata.go) are
      # data tables, not magic constants in logic; promoting these entries to
      # named constants would hurt readability without any benefit.
      - linters:
          - goconst
        text: 'string `(severity|instance|alertname)` has'
      - linters:
          - gocognit
          - gocyclo
        path: internal/storage/(sqlstore|loki)/.*\.go
      - linters:
          - revive
        text: var-naming.*Url
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
